name: PR 61 resolved integration browser replay
on:
  push:
    branches: [refactor/mock-network-profiles]
    paths: [.github/workflows/pr61-integration-validation.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr61-resolved-integration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MAIN_SHA: 409a187aecd2d78a855b29687374c830edb66659
      EVIDENCE: /tmp/pr61-final-replay
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse the exact source that passed the complete suite and build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr61-previous "$EVIDENCE"
          test "$(git diff --name-only b9b48b2a97c30b7cc05e58d8b3bec439d27c15c1 HEAD)" = .github/workflows/pr61-integration-validation.yml
          gh api repos/nocobase/NocoReach/actions/runs/38552994940/jobs > "$EVIDENCE/prior-jobs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          jobs=json.loads(Path(os.environ['EVIDENCE'],'prior-jobs.json').read_text())['jobs']
          steps=next(j['steps'] for j in jobs if j['id']==115815198853)
          assert next(s['conclusion'] for s in steps if s['name']=='All TypeScript projects, scoped lint, complete suite and Linux build')=='success'
          PY
          gh run download 38552994940 --repo nocobase/NocoReach --name pr61-final-integration --dir /tmp/pr61-previous
          (cd /tmp/pr61-previous && sha256sum --check <<'CHECKSUMS'
          b33f13aa9022dd8e39c04c3835188f90d82d4b5ae07a18fe9194e38e583187fd  final-source.bundle
          853d3e50b4d7007e629264e36fc632e37810be93b58d8cecb5e042e6c875e6c3  browser.sh
          84a1d0010262006848c3aeafe0e2e65e5c0df62e833a2f82dab65763f264c09a  publish.sh
          31f1731a77dc6311328a3a91d5d05624885bff03d2e7f2e47107a24f7ce61a53  tests.log
          683fb33eb896d0d1db44267c0f01979a0e386b9fdadf04d86c25d9131aacb1ef  typecheck.log
          a93dea611ea1fcc6a49a50d796973ce906b01c2b7055fdb00e8b379ec4423650  build.log
          CHECKSUMS
          )
          git bundle verify /tmp/pr61-previous/final-source.bundle
          git fetch /tmp/pr61-previous/final-source.bundle refs/integration/validated:refs/integration/validated
          git checkout --detach e4573aa1e9032100f79d578fa5b8a5b4c7b06af6
          test "$(git rev-parse HEAD^{tree})" = 4a57f65db202d560059f3c38883f5196074780aa
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          git diff --exit-code "$MAIN_SHA" -- .github/workflows
          test ! -e .github/workflows/pr61-integration-validation.yml
          cp /tmp/pr61-previous/{tests.log,typecheck.log,build.log,scoped-lint.log,format.log,source-tree.txt,main-parent.txt,final-pr-stat.txt} "$EVIDENCE/"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/expected-pr-parent.txt"
          cp /tmp/pr61-previous/publish.sh "$EVIDENCE/publish.sh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          script=Path('/tmp/pr61-previous/browser.sh').read_text()
          old="await page.goto(base+'/data/website?days=28&data=live');"
          assert script.count(old)==1
          script=script.replace(old,"await page.goto(base+'/website?days=28&data=live');\n  await expect(page).toHaveURL(/\\/main\\/website(?:\\?|$)/);")
          Path(os.environ['EVIDENCE'],'browser.sh').write_text(script)
          Path(os.environ['EVIDENCE'],'validation-origin.json').write_text('{"fullSuiteRun":38552994940,"fullSuitePassed":2091,"testFiles":243,"sourceTree":"4a57f65db202d560059f3c38883f5196074780aa","applicationChangedForReplay":false,"harnessChange":"Use /website, not unregistered /data/website, and assert route"}\n')
          PY
          bash -n "$EVIDENCE/browser.sh"
          bash -n "$EVIDENCE/publish.sh"
      - uses: pnpm/action-setup@c336a2788d9774dccfdeb4823a5058ccc9f07453
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run all five actual browser checks on the unchanged validated source
        run: bash "$EVIDENCE/browser.sh"
      - name: Store validated source objects without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/publish.sh"
      - name: Retain final browser and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr61-final-replay
          path: /tmp/pr61-final-replay/
          retention-days: 14
