name: PR 61 resolved integration validation
on:
  push:
    branches: [refactor/mock-network-profiles]
    paths: [.github/workflows/pr61-integration-validation.yml]
permissions:
  contents: write
concurrency:
  group: pr61-resolved-integration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAIN_SHA: 409a187aecd2d78a855b29687374c830edb66659
      EVIDENCE: /tmp/pr61-final-integration
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and run the pinned integration harness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr61-harness "$EVIDENCE"
          git show 8fdc2eef1fd11f315171e7d2c80d8ad27ed4f51f:.github/workflows/pr61-integration-validation.yml > /tmp/pr61-harness/source.yml
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          source=Path('/tmp/pr61-harness/source.yml').read_text()
          def extract(name):
            block=source.split('      - name: '+name+'\n',1)[1].split('\n      - ',1)[0]
            return dedent(block.split('        run: |\n',1)[1])+'\n'
          scripts={
            'restore':extract('Restore the checksum-verified local resolution and integrate the latest reviewed main'),
            'checks':extract('Static checks, full regression and application build'),
            'browser':extract('Verify integrated GitHub history, hotspots, website report and Profile redirect in a real browser'),
            'publish':extract('Store validated source objects without moving any branch'),
          }
          old='test "$(git rev-parse HEAD^)" = b9b48b2a97c30b7cc05e58d8b3bec439d27c15c1'
          assert scripts['restore'].count(old)==1
          scripts['restore']=scripts['restore'].replace(old,'git merge-base --is-ancestor b9b48b2a97c30b7cc05e58d8b3bec439d27c15c1 HEAD\ntest "$(git diff --name-only b9b48b2a97c30b7cc05e58d8b3bec439d27c15c1 HEAD)" = .github/workflows/pr61-integration-validation.yml')
          merge='git merge --no-commit --no-ff "$MAIN_SHA" 2>&1 | tee "$EVIDENCE/latest-main-merge.log"'
          assert scripts['restore'].count(merge)==1
          scripts['restore']=scripts['restore'].replace(merge,merge+' || { python3 /tmp/pr61-harness/changelog.py; git add CHANGELOG.md; }')
          changelog="""
          import os,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args]).decode()
          assert git('diff','--name-only','--diff-filter=U').splitlines()==['CHANGELOG.md']
          prefix='# NocoReach Changelog\\n\\n'
          ours=git('show','9330f47199ad9717f1f66323886bcbf0ac951f94:CHANGELOG.md')
          old=git('show','2ed9eb5573be1ea87965c7a3d06ef8b5d58b66b3:CHANGELOG.md')
          main=git('show',os.environ['MAIN_SHA']+':CHANGELOG.md')
          assert ours.startswith(prefix) and old.startswith(prefix) and main.startswith(prefix)
          section=ours[len(prefix):ours.index('## Unreleased — PM-276')]
          assert section.startswith('## Unreleased — Network profiles')
          assert ours==prefix+section+old[len(prefix):]
          Path('CHANGELOG.md').write_text(prefix+section+main[len(prefix):])
          """
          Path('/tmp/pr61-harness/changelog.py').write_text(dedent(changelog))
          assert scripts['browser'].count('[data-metric="starsAdded"]')==1
          scripts['browser']=scripts['browser'].replace('[data-metric="starsAdded"]','[data-metric="stars"]')
          assert scripts['browser'].count("page.locator('canvas').first()") == 1
          scripts['browser']=scripts['browser'].replace("page.locator('canvas').first()", "page.locator('[data-website-chart] svg').first()")
          for name,script in scripts.items():
            Path('/tmp/pr61-harness',name+'.sh').write_text(script)
          PY
          for script in /tmp/pr61-harness/*.sh; do bash -n "$script"; done
          cp /tmp/pr61-harness/*.sh /tmp/pr61-harness/changelog.py "$EVIDENCE/"
          bash /tmp/pr61-harness/restore.sh
      - uses: pnpm/action-setup@c336a2788d9774dccfdeb4823a5058ccc9f07453
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All TypeScript projects, scoped lint, complete suite and Linux build
        run: bash /tmp/pr61-harness/checks.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Actual browser acceptance for the integrated reports
        run: bash /tmp/pr61-harness/browser.sh
      - name: Store validated source objects without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash /tmp/pr61-harness/publish.sh
      - name: Retain source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr61-final-integration
          path: /tmp/pr61-final-integration/
          retention-days: 14
