name: Preview on Studio

# Publishes a pull request's head to its own preview App (nocoreach-pr-<number>) in Studio's Preview environment, for
# people to try a change before it merges. It never touches the main deployment: that stays in deploy-studio.yml.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: studio-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Only pull requests from this repository that a maintainer has labeled `preview`: the job runs the pull request's
    # code with the preview key, so a fork or an unreviewed change never reaches it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: studio-preview
    env:
      NB_STUDIO_SERVER: ${{ vars.NB_STUDIO_SERVER }}
      STUDIO_TARGET: ${{ vars.STUDIO_TARGET }}
      STUDIO_NODE_MAJOR: ${{ vars.STUDIO_NODE_MAJOR }}
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@c336a2788d9774dccfdeb4823a5058ccc9f07453 # v4.3.0; packageManager selects pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check preview configuration
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_PREVIEW_API_KEY }}
          STUDIO_CLI: ${{ runner.temp }}/studio-cli/node_modules/.bin/nb-studio
        run: node scripts/ci/preview-studio.mjs --check-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=2 --passWithNoTests=false
      - run: pnpm build --target linux-x64 --node-version 24 --tar
      - name: Install nb-studio
        run: npm install --prefix "$RUNNER_TEMP/studio-cli" --ignore-scripts --no-audit --no-fund @nocobase/studio-cli@1.0.0-beta.56
      - name: Publish the preview
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_PREVIEW_API_KEY }}
          STUDIO_CLI: ${{ runner.temp }}/studio-cli/node_modules/.bin/nb-studio
        run: node scripts/ci/preview-studio.mjs
