<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/nocoreach-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="NocoReach" />
    <meta
      data-rh="true"
      property="og:image"
      content="/assets/nocoreach-mark.svg"
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="/assets/nocoreach-mark.svg"
    />
    <style>
      .app-bootstrap-loading {
        display: flex;
        min-height: 100svh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: oklch(0.985 0 0);
        color: oklch(0.18 0 0);
      }

      .app-bootstrap-loading [data-slot='loading-indicator'] {
        width: 3rem;
        height: 3rem;
        opacity: 0;
        animation: app-bootstrap-reveal 0s 200ms forwards;
      }

      .app-bootstrap-orbit {
        transform-origin: 32px 32px;
        animation: app-bootstrap-spin 1.1s linear infinite;
      }

      html,
      body {
        margin: 0;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-bootstrap-reveal {
        to {
          opacity: 1;
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-bootstrap-loading {
          background: oklch(0.145 0 0);
          color: oklch(0.9 0 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-orbit {
          animation: none;
        }
        .app-bootstrap-loading [data-slot='loading-indicator'] {
          animation: none;
          opacity: 0.65;
        }
      }
    </style>
    <title>NocoReach</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        class="app-bootstrap-loading"
        role="status"
        aria-label="Loading application"
      >
        <svg
          data-slot="loading-indicator"
          viewBox="0 0 64 64"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="32"
            cy="32"
            r="28"
            stroke="currentColor"
            stroke-width="2"
            opacity=".12"
          />
          <g class="app-bootstrap-orbit">
            <path
              d="M32 4a28 28 0 0 1 28 28"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </g>
          <image
            href="/assets/nocoreach-mark.svg"
            x="14"
            y="14"
            width="36"
            height="36"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/client/index.tsx"></script>

  </body>
</html>
