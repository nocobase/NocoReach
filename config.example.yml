# Copy this file to config.yml before starting the application.

# app:
#   Public origin used for callbacks and redirects in production.
#   publicOrigin: https://apps.example.com

# The language the application starts in, for the browser and the server alike. Which languages it offers follows
# from the files in client/locales and server/locales, not from configuration.
# i18n:
#   defaultLocale: zh-CN

# Limits every /api request meets before its route, each off until set. bodyLimit refuses a larger body with 413
# BODY_TOO_LARGE; a route may set its own, usually smaller, limit. timeout answers 503 REQUEST_TIMEOUT when a handler
# has not produced its response in time; a streaming response that has started is not cut off. rateLimit allows max
# requests per window from each client address and answers 429 RATE_LIMITED with Retry-After; GET /api/healthz is
# exempt. Counters live in each process, so every instance counts on its own, and behind a reverse proxy the proxy is
# the client address. API_BODY_LIMIT and API_TIMEOUT set the first two.
# api:
#   bodyLimit: 10mb
#   timeout: 30s
#   rateLimit:
#     max: 600
#     window: 1m

# Values under client are public and embedded in the SPA HTML.
client:
  app:
    title: NocoReach
    # Defaults apply only when no valid browser-local choice is saved.
    # defaultColorScheme: system # light | dark | system
    # defaultTheme: compact # ID from client/theme/theme-presets.ts

users:
  # The first administrator, created only when seeding an empty user table. Changing these values later does not
  # reset an existing account. Replace the password before exposing the application. INITIAL_ADMIN_USERNAME,
  # INITIAL_ADMIN_EMAIL and INITIAL_ADMIN_PASSWORD set them from the environment instead.
  initialAdmin:
    username: nocobase # 3–30 letters, digits, underscores or dots; stored lowercase
    email: admin@nocobase.com # stored lowercase; also signs in
    password: admin123

# Master keys for what the application encrypts at rest — stored credentials and API keys, OAuth tokens — and from
# which the sign-in and session keys are derived. The first key is current; the others only decrypt. To rotate, put a
# new key first with a higher version, run `pnpm nocobase secrets rotate`, then remove the old key. Changing the current
# key signs everyone out. Generate a key with: openssl rand -hex 32. SECRETS_KEYS=2:<key>,1:<key> sets the list from
# the environment instead.
secrets:
  keys:
    - version: 1
      key: replace-with-a-unique-secret

# NocoReach people are added by an administrator (Users, or an invitation), not by signing themselves up.
auth:
  emailAndPassword:
    enabled: true
    autoSignIn: false
    disableSignUp: true
  session:
    storeSessionInDatabase: true

notification:
  channels:
    inbox:
      provider: in-app

    # Uncomment and configure independent email Channels.
    # Values are read as written: ${NAME} is not expanded. To take a secret from the environment instead, map a
    # variable onto its path in env of server/config/notification.ts, such as SMTP_PASSWORD.
    # system-email:
    #   provider: smtp
    #   host: smtp.example.com
    #   port: 587
    #   auth:
    #     user: notifications@example.com
    #     pass: replace-with-the-smtp-password
    #   from: notifications@example.com
    # marketing-email:
    #   provider: resend
    #   apiKey: replace-with-the-resend-api-key
    #   from: marketing@example.com

    # ops-feishu:
    #   provider: feishu-webhook
    #   webhookUrl: https://open.feishu.cn/open-apis/bot/v2/hook/replace-with-the-token
    # ops-dingtalk:
    #   provider: dingtalk-webhook
    #   webhookUrl: https://oapi.dingtalk.com/robot/send?access_token=replace-with-the-token

# 模型服务和密钥在 AI 团队 → 模型配置，由 Agents 插件管理。

# DB_DIALECT, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_SSL and DB_FILENAME override the main
# connection's fields from the environment.
database:
  default: main
  connections:
    main:
      dialect: sqlite
      database: database.sqlite
      debug: false
      # For Oracle, use dialect: oracle and replace database with serviceName: FREEPDB1.
      # For SQL Server, use dialect: mssql and configure encrypt and trustServerCertificate.
      schemaManagement: managed
      migrations:
        autoRun: true
      seeds:
        autoRun: true
    # Additional managed databases use database/<connectionName>/{migrations,seeds}.
    # analytics:
    #   dialect: postgres
    #   host: localhost
    #   database: analytics
    #   username: postgres
    #   password: replace-with-the-password # or DB_ANALYTICS_PASSWORD, declared with connectionEnvironment('analytics', 'DB_ANALYTICS')
    #   schemaManagement: managed
    #   migrations:
    #     autoRun: false
    #   seeds:
    #     autoRun: false
    # An existing database another system owns sets schemaManagement: external and runs no tasks. Its titles,
    # descriptions and relations are read from database/<connection>/metadata/<name>.json unless metadataStore says otherwise.

snowflake:
  # Assign a unique worker ID to each concurrently running instance.
  workerId: 0
  epoch: 1605024000

# Scheduled jobs, such as the Scheduler plugin's. Without jobs.default they run on the built-in memory adapter:
# state kept in the process, read from storage/jobs at startup and written back when the application stops, so a
# process that is killed loses what changed since it started. It serves one process: every other process or instance
# would run its own copy. Set default to memory to keep that without the startup warning, or to redis to run several.
# Redis must persist its data (AOF or RDB) and use maxmemory-policy noeviction, or schedules can be lost.
# jobs:
#   default: redis
#   redis:
#     connection:
#       host: 127.0.0.1
#       port: 6379
#     # namespace: my-app # defaults to the application name; set it when deployments share one Redis

# The jobs configuration the Scheduler plugin's schedules run on, by name. Left out, they follow jobs.default.
# scheduler:
#   jobs: redis

# File logging is independent of terminal formatting.
logging:
  level: info
  file:
    enabled: true
    retentionDays: 7
    name: app
    maxFileSizeMB: 10
    maxTotalSizeMB: 500
  loggers:
    request:
      file:
        name: request
  console:
    enabled: true
    # Set true for human-readable terminal output.
    pretty: false

# 只读采集器：小红书见 docs/XIAOHONGSHU-COLLECTOR.md；YouTube 迁移见 docs/YOUTUBE.md。
# 地址必须能从本应用服务端访问；127.0.0.1 指本应用服务器，不是访问页面的用户电脑。
# token 由部署管理员安全配置，不要提交真实值。远程必须 HTTPS；同机允许回环 HTTP。
# nocoreach:
#   browserCollectors:
#     - id: browser-team
#       name: 团队小红书浏览器
#       platforms: [xiaohongshu] # 明确允许的平台；不会自动授权新增平台
#       url: https://collector.example.com/nocoreach-xhs
#       token: replace-with-a-private-token-at-least-32-characters
#       projectIds: ['1'] # 省略表示允许所有 NocoReach 项目选择；明确列出可限制项目
#     - id: youtube-team
#       name: 团队 YouTube Collector
#       platforms: [youtube] # 每项目必须恰好匹配一个；无需浏览器
#       url: https://collector.example.com
#       token: replace-with-a-private-token-at-least-32-characters
#       projectIds: ['1']
# YouTube 不再运行本地 yt-dlp；先迁移 Collector 网络出口，再关闭该连接的应用代理。

# NocoReach 统一模拟数据，默认关闭。只用于全新、专用的 demo/test 部署；详见 docs/MOCK-DATA.md。
# Agent 配置、模型测试及任务执行可使用真实服务；最后的任务发布只记录模拟完成，不合并 PR。
# APP_STORAGE_DIR 与 DB_FILENAME 应指向独立的新 storage/SQLite 数据库；其他数据库使用独立连接。
# 模拟库会留下永久数据集标记，不能关闭模拟后复用为真实环境；重置场景不删除业务数据或凭据。
# 通知仅保留上方 inbox/in-app；其他通道须删除或 enabled:false，jobs.default、scheduler.jobs、notification.jobs 只能选择 memory，不能共用 Redis 队列。
# 首次启用拒绝已有 NocoReach 业务记录/凭据。
# agents.server.enabled 已废弃：Online Agent 始终允许执行，旧配置中的 false 也不再禁用执行器。
# nocoreachMock:
#   enabled: true
#   environment: demo # 只允许 demo | test；NODE_ENV 不能替代
#   initializeData: true # 默认自动创建丰富的演示项目；空白集成测试可设为 false
# Mail providers must be configured before connecting accounts.
# Mock deployments must leave providers empty or explicitly disable every provider; mail.jobs must use memory.
mail:
  providers: {}
